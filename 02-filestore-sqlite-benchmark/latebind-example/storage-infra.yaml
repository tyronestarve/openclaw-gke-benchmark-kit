apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: master-shared-pvc
  namespace: default
spec:
  accessModes: [ReadWriteMany]
  storageClassName: openclaw-fsms  # 复用现有 multishare 实例切 share,免建 1Ti Regional
  resources:
    requests: {storage: 100Gi}
---
# Verified Baseline: GKE Standard v1.36.4-gke.2377000 / COS 6.12.110+ / containerd 2.2.7
# Uses open_tree + move_mount into per-pod runsc-gofer mount namespace (host PID 1 untouched),
# with hostNetwork: true, ThreadingHTTPServer, HTTP 409 lease conflict, and automatic host_watched fallback.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: storage-node-daemon
  namespace: default
spec:
  selector:
    matchLabels: {app: storage-node-daemon}
  template:
    metadata:
      labels: {app: storage-node-daemon}
    spec:
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        sandbox.gke.io/runtime: gvisor
      tolerations:
      - key: "sandbox.gke.io/runtime"
        operator: "Equal"
        value: "gvisor"
        effect: "NoSchedule"
      containers:
      - name: daemon
        image: python:3.11-slim
        securityContext: {privileged: true}
        env:
        - name: LATEBIND_MODE
          value: "auto" # "auto" | "gofer_mountns" | "host_watched"
        volumeMounts:
        - {name: master-filestore, mountPath: /mnt/master-volume}
        command: ["python3", "-u", "-c"]
        args:
        - |
          import ctypes, hmac, json, os, shutil, socket, threading, time, traceback
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          libc = ctypes.CDLL("libc.so.6", use_errno=True)
          SYS_open_tree = 428
          SYS_move_mount = 429
          SYS_mount_setattr = 442
          AT_FDCWD = -100
          AT_EMPTY_PATH = 0x1000
          AT_RECURSIVE = 0x8000
          OPEN_TREE_CLONE = 1
          MOVE_MOUNT_F_EMPTY_PATH = 0x00000004
          CLONE_NEWNS = 0x00020000
          MOUNT_ATTR_RDONLY = 0x00000001
          MS_BIND = 4096
          MS_RDONLY = 1
          MS_REMOUNT = 32
          MNT_FORCE = 1
          MNT_DETACH = 2

          AUTH_TOKEN = os.environ.get("LATEBIND_AUTH_TOKEN", "").strip()
          LATEBIND_MODE = os.environ.get("LATEBIND_MODE", "auto").strip().lower()

          class LeaseConflictError(RuntimeError):
            pass

          key_locks_guard = threading.Lock()
          key_locks = {}

          def get_key_lock(key):
            with key_locks_guard:
              lk = key_locks.get(key)
              if lk is None:
                lk = threading.Lock()
                key_locks[key] = lk
              return lk

          def acquire_lease_atomic(lease_file, pod_uid, volume_name, enforce_lease, force_rebind):
            my_node = socket.gethostname()
            payload = json.dumps({"pod_uid": pod_uid, "node": my_node, "ts": time.time()}).encode()

            def _excl_create():
              fd = os.open(lease_file, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o644)
              try:
                os.write(fd, payload)
                os.fsync(fd)
                os.fchown(fd, 1000, 1000)
              finally:
                os.close(fd)

            try:
              _excl_create()
              return True
            except FileExistsError:
              pass

            old = {}
            for _ in range(5):
              try:
                raw = open(lease_file).read().strip()
                if raw:
                  old = json.loads(raw)
                  break
              except Exception:
                pass
              time.sleep(0.02)

            old_uid = old.get("pod_uid")
            old_node = old.get("node")
            if old_uid == pod_uid and old_node == my_node:
              return False

            if enforce_lease and not force_rebind:
              if old_node == my_node and old_uid:
                if find_gofer_targets(old_uid, volume_name) or find_pod_pids(old_uid):
                  raise LeaseConflictError(f"Directory already leased by active local pod {old_uid}")
              elif old_node and old_node != my_node:
                raise LeaseConflictError(
                  f"Directory already leased by pod {old_uid} on node {old_node} "
                  f"(call unbind first or pass force_rebind=true after node crash)"
                )
              else:
                try:
                  age = time.time() - os.stat(lease_file).st_mtime
                except OSError:
                  age = 0.0
                if age < 10.0:
                  raise LeaseConflictError("Directory lease is currently being initialized by another claimer")

            try:
              os.unlink(lease_file)
            except FileNotFoundError:
              pass
            try:
              _excl_create()
              return True
            except FileExistsError:
              raise LeaseConflictError("Concurrent lease acquisition won by another claimer")

          def _safe_waitpid(pid):
            try:
              os.waitpid(pid, 0)
            except ChildProcessError:
              pass

          def best_effort_release_lease(target_dir, pod_uid, budget_sec=0.2):
            lpid = os.fork()
            if lpid == 0:
              try:
                lf = os.path.join(target_dir, ".latebind_lease.json")
                cur = json.loads(open(lf).read() or "{}")
                if cur.get("pod_uid") == pod_uid:
                  os.unlink(lf)
              except Exception:
                pass
              os._exit(0)
            steps = max(1, int(budget_sec / 0.01))
            for _ in range(steps):
              wpid, _ = os.waitpid(lpid, os.WNOHANG)
              if wpid == lpid:
                return
              time.sleep(0.01)
            threading.Thread(target=_safe_waitpid, args=(lpid,), daemon=True).start()

          class MountAttr(ctypes.Structure):
            _fields_ = [
              ("attr_set", ctypes.c_uint64),
              ("attr_clr", ctypes.c_uint64),
              ("propagation", ctypes.c_uint64),
              ("userns_fd", ctypes.c_uint64),
            ]

          watched_lock = threading.Lock()
          watched_host_mounts = {}

          def host_mount_reaper_loop():
            while True:
              time.sleep(0.05)
              with watched_lock:
                items = list(watched_host_mounts.items())
              for pod_uid, (pids, proc1_target, proc1_parent) in items:
                if not any(os.path.exists(f"/proc/{p}") for p in pids):
                  libc.umount2(proc1_target.encode(), MNT_FORCE | MNT_DETACH)
                  ready_f = os.path.join(proc1_parent, ".ready")
                  if os.path.exists(ready_f):
                    try:
                      os.remove(ready_f)
                    except OSError:
                      pass
                  with watched_lock:
                    watched_host_mounts.pop(pod_uid, None)

          threading.Thread(target=host_mount_reaper_loop, daemon=True).start()

          def safe_join(base, *parts):
            base = os.path.abspath(base)
            path = os.path.abspath(os.path.join(base, *parts))
            if os.path.commonpath([base, path]) != base:
              raise ValueError(f"path escapes base directory: {path}")
            return path

          def require_segment(name, value):
            if not value or value in {".", ".."} or value != os.path.basename(value):
              raise ValueError(f"invalid {name}: {value!r}")
            return value

          def find_gofer_targets(pod_uid, volume_name):
            needle = f"/var/lib/kubelet/pods/{pod_uid}/volumes/kubernetes.io~empty-dir/{volume_name}"
            targets = []
            for entry in os.listdir("/proc"):
              if not entry.isdigit():
                continue
              try:
                cmdline = open(f"/proc/{entry}/cmdline", "rb").read()
                if b"runsc-gofer" not in cmdline:
                  continue
                groot = os.readlink(f"/proc/{entry}/root")
                with open(f"/proc/{entry}/mountinfo", "r") as mf:
                  for line in mf:
                    parts = line.split(" - ")[0].split(" ")
                    if len(parts) >= 5 and parts[3] == needle:
                      mount_point = parts[4].replace("\\040", " ")
                      targets.append((int(entry), groot, mount_point))
              except Exception:
                continue
            return targets

          def find_pod_pids(pod_uid):
            pids = []
            uid_bytes = pod_uid.encode()
            for entry in os.listdir("/proc"):
              if not entry.isdigit():
                continue
              try:
                cg = open(f"/proc/{entry}/cgroup", "rb").read()
                if uid_bytes in cg or uid_bytes.replace(b"-", b"_") in cg:
                  pids.append(int(entry))
              except Exception:
                continue
            return pids

          def run_in_fork(fn):
            r_fd, w_fd = os.pipe()
            pid = os.fork()
            if pid == 0:
              os.close(r_fd)
              try:
                fn()
                os._exit(0)
              except LeaseConflictError as ce:
                try:
                  os.write(w_fd, f"LEASE_CONFLICT:{ce}".encode()[:4096])
                finally:
                  os._exit(2)
              except Exception:
                try:
                  os.write(w_fd, traceback.format_exc().encode()[:4096])
                finally:
                  os._exit(1)
            os.close(w_fd)
            err_bytes = b""
            while True:
              chunk = os.read(r_fd, 4096)
              if not chunk:
                break
              err_bytes += chunk
            os.close(r_fd)
            _, status = os.waitpid(pid, 0)
            if os.WIFEXITED(status) and os.WEXITSTATUS(status) == 0:
              return
            err_text = err_bytes.decode(errors="replace")
            if os.WIFEXITED(status) and os.WEXITSTATUS(status) == 2:
              raise LeaseConflictError(err_text.removeprefix("LEASE_CONFLICT:"))
            raise RuntimeError(err_text or f"Worker exited with status {status}")

          class DaemonHTTPServer(ThreadingHTTPServer):
            daemon_threads = True

          class Handler(BaseHTTPRequestHandler):
            def do_POST(self):
              try:
                if AUTH_TOKEN:
                  hdr = self.headers.get("Authorization", "")
                  if not hmac.compare_digest(hdr, f"Bearer {AUTH_TOKEN}"):
                    self.send_response(401)
                    self.end_headers()
                    self.wfile.write(b"Unauthorized")
                    return

                content_len = int(self.headers.get("Content-Length", 0))
                data = json.loads(self.rfile.read(content_len))
                pod_uid = require_segment("pod_uid", data["pod_uid"])
                user_id = require_segment("user_id", data["user_id"])
                action = data["action"]
                volume_name = require_segment("volume_name", data["volume_name"])
                sub_dir = require_segment("sub_dir", data["sub_dir"])
                is_readonly = bool(data.get("is_readonly", False))
                enforce_lease = bool(data.get("enforce_lease", True))
                force_rebind = bool(data.get("force_rebind", False))
                snapshot_id = data.get("snapshot_id")
                if snapshot_id is not None:
                  snapshot_id = require_segment("snapshot_id", snapshot_id)

                if snapshot_id:
                  source = safe_join("/mnt/master-volume/snapshots", snapshot_id)
                  if not os.path.exists(source):
                    raise FileNotFoundError(f"Requested snapshot source does not exist: {source}")
                else:
                  source = safe_join("/mnt/master-volume/users", user_id)

                if action == "bind":
                  targets = [] if LATEBIND_MODE == "host_watched" else find_gofer_targets(pod_uid, volume_name)
                  if LATEBIND_MODE == "gofer_mountns" and not targets:
                    raise RuntimeError(f"No active runsc-gofer mount found for pod_uid={pod_uid} volume={volume_name}")

                  with get_key_lock(source):
                    lease_created = False
                    lease_file = os.path.join(source, ".latebind_lease.json")
                    if not snapshot_id:
                      os.makedirs(source, exist_ok=True)
                      if not is_readonly:
                        st = os.stat(source)
                        if st.st_uid != 1000 or st.st_gid != 1000:
                          os.chown(source, 1000, 1000)
                        lease_created = acquire_lease_atomic(
                          lease_file, pod_uid, volume_name, enforce_lease, force_rebind
                        )

                    try:
                      if targets:
                        for gpid, groot, mount_point in targets:
                          def _bind_worker(gpid=gpid, groot=groot, mount_point=mount_point):
                            tree_fd = libc.syscall(
                              SYS_open_tree, ctypes.c_int(AT_FDCWD), source.encode(), ctypes.c_uint(OPEN_TREE_CLONE)
                            )
                            if tree_fd < 0:
                              raise OSError(ctypes.get_errno(), "open_tree(OPEN_TREE_CLONE) failed")
                            if is_readonly:
                              mattr = MountAttr(attr_set=MOUNT_ATTR_RDONLY, attr_clr=0, propagation=0, userns_fd=0)
                              if libc.syscall(
                                SYS_mount_setattr,
                                ctypes.c_int(tree_fd),
                                b"",
                                ctypes.c_uint(AT_EMPTY_PATH | AT_RECURSIVE),
                                ctypes.byref(mattr),
                                ctypes.c_size_t(ctypes.sizeof(mattr)),
                              ) != 0:
                                raise OSError(ctypes.get_errno(), "mount_setattr(MOUNT_ATTR_RDONLY) failed")

                            gofer_mnt_fd = os.open(f"/proc/{gpid}/ns/mnt", os.O_RDONLY)
                            if libc.setns(gofer_mnt_fd, CLONE_NEWNS) != 0:
                              raise OSError(ctypes.get_errno(), "setns(gofer) failed")
                            os.close(gofer_mnt_fd)
                            if groot and groot != "/":
                              os.chroot(groot)
                              os.chdir("/")

                            dest = safe_join(mount_point, sub_dir)
                            os.makedirs(dest, exist_ok=True)
                            if libc.syscall(
                              SYS_move_mount,
                              ctypes.c_int(tree_fd),
                              b"",
                              ctypes.c_int(AT_FDCWD),
                              dest.encode(),
                              ctypes.c_uint(MOVE_MOUNT_F_EMPTY_PATH),
                            ) != 0:
                              raise OSError(ctypes.get_errno(), "move_mount into gofer failed")
                            with open(safe_join(mount_point, ".ready"), "w") as f:
                              f.write("ready")

                          run_in_fork(_bind_worker)
                        msg = f"Success: Bound Filestore folder {user_id} into gofer mountns for pod {pod_uid} (host PID 1 untouched)"
                      else:
                        pids = find_pod_pids(pod_uid)
                        if not pids:
                          raise RuntimeError(f"Pod {pod_uid} has no active processes on host")
                        proc1_parent = safe_join("/proc/1/root/var/lib/kubelet/pods", pod_uid, "volumes/kubernetes.io~empty-dir", volume_name)
                        proc1_target = safe_join(proc1_parent, sub_dir)
                        os.makedirs(proc1_target, exist_ok=True)
                        def _fallback_worker():
                          tree_fd = libc.syscall(
                            SYS_open_tree, ctypes.c_int(AT_FDCWD), source.encode(), ctypes.c_uint(OPEN_TREE_CLONE)
                          )
                          if tree_fd < 0:
                            raise OSError(ctypes.get_errno(), "open_tree(OPEN_TREE_CLONE) failed")
                          if is_readonly:
                            mattr = MountAttr(attr_set=MOUNT_ATTR_RDONLY, attr_clr=0, propagation=0, userns_fd=0)
                            libc.syscall(
                              SYS_mount_setattr, ctypes.c_int(tree_fd), b"", ctypes.c_uint(AT_EMPTY_PATH | AT_RECURSIVE),
                              ctypes.byref(mattr), ctypes.c_size_t(ctypes.sizeof(mattr))
                            )
                          host_mnt_fd = os.open("/proc/1/ns/mnt", os.O_RDONLY)
                          libc.setns(host_mnt_fd, CLONE_NEWNS)
                          os.close(host_mnt_fd)
                          real_target = safe_join("/var/lib/kubelet/pods", pod_uid, "volumes/kubernetes.io~empty-dir", volume_name, sub_dir)
                          if libc.syscall(
                            SYS_move_mount, ctypes.c_int(tree_fd), b"", ctypes.c_int(AT_FDCWD),
                            real_target.encode(), ctypes.c_uint(MOVE_MOUNT_F_EMPTY_PATH)
                          ) != 0:
                            raise OSError(ctypes.get_errno(), "move_mount into host failed")
                        run_in_fork(_fallback_worker)
                        with watched_lock:
                          watched_host_mounts[pod_uid] = (pids, proc1_target, proc1_parent)
                        with open(os.path.join(proc1_parent, ".ready"), "w") as rf:
                          rf.write("ready")
                        msg = f"Success: Bound Filestore folder {user_id} via fallback host_watched mode for pod {pod_uid}"
                    except Exception:
                      if lease_created:
                        try:
                          os.unlink(lease_file)
                        except OSError:
                          pass
                      raise

                elif action == "unbind":
                  targets = [] if LATEBIND_MODE == "host_watched" else find_gofer_targets(pod_uid, volume_name)
                  if not snapshot_id:
                    best_effort_release_lease(source, pod_uid)
                  if targets:
                    for gpid, groot, mount_point in targets:
                      def _unbind_worker(gpid=gpid, groot=groot, mount_point=mount_point):
                        gofer_mnt_fd = os.open(f"/proc/{gpid}/ns/mnt", os.O_RDONLY)
                        if libc.setns(gofer_mnt_fd, CLONE_NEWNS) != 0:
                          raise OSError(ctypes.get_errno(), "setns(gofer) failed")
                        os.close(gofer_mnt_fd)
                        if groot and groot != "/":
                          os.chroot(groot)
                          os.chdir("/")
                        dest = safe_join(mount_point, sub_dir)
                        ready_file = safe_join(mount_point, ".ready")
                        if os.path.exists(ready_file):
                          os.remove(ready_file)
                        if libc.umount2(dest.encode(), MNT_FORCE | MNT_DETACH) != 0:
                          err = ctypes.get_errno()
                          if err not in (2, 22):
                            raise OSError(err, "umount2(MNT_FORCE|MNT_DETACH) failed")

                      run_in_fork(_unbind_worker)
                    msg = f"Success: Unbound {pod_uid}"
                  else:
                    proc1_parent = safe_join("/proc/1/root/var/lib/kubelet/pods", pod_uid, "volumes/kubernetes.io~empty-dir", volume_name)
                    proc1_target = safe_join(proc1_parent, sub_dir)
                    libc.umount2(proc1_target.encode(), MNT_FORCE | MNT_DETACH)
                    ready_f = os.path.join(proc1_parent, ".ready")
                    if os.path.exists(ready_f):
                      os.remove(ready_f)
                    with watched_lock:
                      watched_host_mounts.pop(pod_uid, None)
                    msg = f"Success: Unbound fallback host mount for {pod_uid}"

                elif action == "delete":
                  with get_key_lock(source):
                    if os.path.exists(source):
                      shutil.rmtree(source)
                      if snapshot_id:
                        msg = f"Success: Deleted snapshot {snapshot_id}"
                      else:
                        msg = f"Success: Deleted persistent directory for user {user_id}"
                    else:
                      if snapshot_id:
                        msg = f"Snapshot {snapshot_id} does not exist."
                      else:
                        msg = f"Directory for user {user_id} does not exist."
                else:
                  raise ValueError(f"Unknown action: {action}")

                self.send_response(200)
                self.end_headers()
                self.wfile.write(msg.encode())
              except LeaseConflictError as ce:
                self.send_response(409)
                self.end_headers()
                self.wfile.write(str(ce).encode())
              except Exception:
                tb = traceback.format_exc()
                print(f"Exception handling request:\n{tb}")
                self.send_response(500)
                self.end_headers()
                self.wfile.write(tb.encode())

          print(f"storage-node-daemon (multishare) ready on 127.0.0.1:9090 (mode={LATEBIND_MODE})", flush=True)
          DaemonHTTPServer(("127.0.0.1", 9090), Handler).serve_forever()
      volumes:
      - name: master-filestore
        persistentVolumeClaim:
          claimName: master-shared-pvc # Your Filestore RWX volume claim
